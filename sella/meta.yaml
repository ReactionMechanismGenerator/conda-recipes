{% set name = "sella" %}
{% set version = "2.4.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/sella-{{ version }}.tar.gz
  sha256: ac930b2b8e670d161c3d3202ea43ce5427c94591b17191058f18892c70a7a0a4

build:
  number: 0
  skip: true # [win]
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - {{ compiler('c') }}
  host:
    - pip
    - python=3.9
    - cython<3
    - {{ pin_compatible('numpy') }}
    - scipy >=1.1.10
  run:
    - ase
    - python=3.9
    - jax >=0.2.3
    - jaxlib >=0.1.56
    - scipy >=1.1.10
    - {{ pin_compatible('numpy') }}

test:
  imports:
    - sella

about:
  home: https://github.com/zadorlab/sella
  summary: A Python software package for saddle point optimization and minimization of atomic systems. 
  license: LGPL-3.0
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - mjohnson541
